exclude: third_party/

repos:
  - repo: https://github.com/astral-sh/uv-pre-commit
    # uv version.
    rev: 0.5.14
    hooks:
      - id: uv-lock
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version.
    rev: v0.8.6
    hooks:
      # Run the linter.
      - id: ruff
        args: [--fix]
      - id: ruff-format
      # Google docstrings, enforced only on fork-owned modules so upstream openpi files stay merge-clean.
      - id: ruff
        name: ruff (google docstrings, fork-owned)
        args: [--select, D]
        files: ^(src/openpi/models/rtc\.py|src/openpi/serving/rtc_stream_server\.py|scripts/(serve_rtc_stream|rtc_stream_client|validate_actions|validate_checkpoint)\.py|scripts/geniesim/.*\.py)$